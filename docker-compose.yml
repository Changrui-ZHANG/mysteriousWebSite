x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: messagewall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messagewall"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  server:
    build: ./server
    restart: always
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/messagewall
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-}
      - ADMIN_CODE=${ADMIN_CODE:-Changrui}
      - SUPER_ADMIN_CODE=${SUPER_ADMIN_CODE:-ChangruiZ}
      - JPA_SHOW_SQL=false
      - AVATAR_UPLOAD_DIR=/app/uploads/avatars
      - MEDIA_UPLOAD_DIR=/app/uploads/media
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  client:
    build: ./client
    restart: always
    expose:
      - "80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  postgres-data:
  uploads:
